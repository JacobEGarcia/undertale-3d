<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UNDERTALE 3D - LAND OF THE DEAD</title>
<style>
  @font-face {
    font-family: 'PS2P';
    src: url('press-start-2p.ttf') format('truetype');
    font-display: swap;
  }
  html, body { margin:0; padding:0; background:#000; overflow:hidden; height:100%; }
  #c { display:block; width:100vw; height:100vh; }
  * { user-select:none; -webkit-user-select:none; }
  .px { font-family:'PS2P', monospace; color:#fff; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  #fade { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity 0.12s linear; }
  #vig { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%); }

  /* ---------- title ---------- */
  #title { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000; z-index:30; }
  #title h1 { font-family:'PS2P',monospace; color:#ffd9a0; font-size:40px; letter-spacing:6px; margin:0 0 6px 0; text-shadow:0 0 22px rgba(255,143,31,0.5); }
  #title h2 { font-family:'PS2P',monospace; color:#e8397a; font-size:13px; letter-spacing:9px; margin:0 0 44px 0; }
  #title .sub { font-family:'PS2P',monospace; color:#b08060; font-size:10px; margin:0 0 70px 0; letter-spacing:2px; }
  #title .go { font-family:'PS2P',monospace; color:#ffd23a; font-size:13px; animation:blink 1.1s steps(2,start) infinite; }
  #title .ctl { position:absolute; bottom:26px; font-family:'PS2P',monospace; color:#555; font-size:9px; letter-spacing:1px; }
  @keyframes blink { to { visibility:hidden; } }

  /* ---------- battle UI ---------- */
  #battle { position:fixed; left:0; right:0; bottom:0; display:none; z-index:20; padding:0 0 26px 0; }
  #dlg { position:fixed; left:50%; transform:translateX(-50%); bottom:118px; z-index:21; width:640px; max-width:86vw; border:3px solid #fff; border-radius:6px; background:#000; min-height:86px; padding:16px 20px; box-sizing:border-box; font-size:13px; line-height:1.7; display:none; white-space:pre-wrap; }
  #hud { width:640px; max-width:86vw; margin:0 auto; display:none; align-items:center; justify-content:space-between; }
  #hud .left { display:flex; align-items:center; gap:14px; }
  #hud .nm { font-size:11px; }
  #hud .lv { font-size:11px; color:#bbb; }
  #hpwrap { display:flex; align-items:center; gap:6px; margin-right:30px; }
  #hpbar { width:80px; height:14px; background:#500; border:1px solid #800; }
  #hpfill { height:100%; width:100%; background:#ff0; }
  #hptxt { font-size:10px; color:#fff; }
  #btns { display:flex; gap:26px; }
  .btn { font-family:'PS2P',monospace; font-size:11px; color:#ff7f27; border:3px solid #ff7f27; border-radius:5px; padding:10px 14px 8px 14px; position:relative; }
  .btn.sel { color:#ffff66; border-color:#ffff66; }
  .btn.sel::before { content:''; position:absolute; left:-16px; top:50%; transform:translateY(-58%); width:10px; height:10px;
    background:#ff0000; clip-path:path('M5,9 C2,6 0,4.5 0,2.8 C0,1.2 1.2,0 2.7,0 C3.7,0 4.5,0.5 5,1.3 C5.5,0.5 6.3,0 7.3,0 C8.8,0 10,1.2 10,2.8 C10,4.5 8,6 5,9 Z'); }
  #menu { width:640px; max-width:86vw; margin:0 auto 14px auto; border:3px solid #fff; border-radius:6px; background:#000; min-height:86px; padding:16px 20px; box-sizing:border-box; display:none; font-size:13px; line-height:1.9; }
  #menu .opt { display:block; position:relative; padding-left:26px; cursor:default; }
  #menu .opt.sel { color:#ffff66; }
  #menu .opt.sel::before { content:''; position:absolute; left:0; top:0.55em; width:10px; height:10px;
    background:#ff0000; clip-path:path('M5,9 C2,6 0,4.5 0,2.8 C0,1.2 1.2,0 2.7,0 C3.7,0 4.5,0.5 5,1.3 C5.5,0.5 6.3,0 7.3,0 C8.8,0 10,1.2 10,2.8 C10,4.5 8,6 5,9 Z'); }
  #menu .opt.mercy-gold.sel { color:#ffff66; }

  /* fight meter */
  #meter { position:fixed; left:50%; top:38%; transform:translate(-50%,-50%); width:420px; height:56px; border:3px solid #fff; border-radius:4px; background:#000; display:none; z-index:22; }
  #meter .target { position:absolute; left:50%; top:0; width:6px; height:100%; background:rgba(255,255,255,0.25); transform:translateX(-50%); }
  #meter .cursor { position:absolute; left:0; top:-4px; width:5px; height:64px; background:#0f0; }
  #dmg { position:fixed; left:50%; top:26%; transform:translateX(-50%); font-family:'PS2P',monospace; color:#fff; font-size:22px; display:none; z-index:23; text-shadow:2px 2px 0 #000; }

  /* generic center card */
  #card { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.88); z-index:26; text-align:center; }
  #card .big { font-family:'PS2P',monospace; font-size:20px; color:#fff; margin-bottom:20px; line-height:2; }
  #card .small { font-family:'PS2P',monospace; font-size:10px; color:#999; line-height:2; }
  #hint { position:fixed; top:14px; left:16px; font-family:'PS2P',monospace; font-size:9px; color:rgba(255,255,255,0.4); z-index:15; display:none; white-space:pre; }
  #mute { position:fixed; top:14px; right:16px; font-family:'PS2P',monospace; font-size:9px; color:rgba(255,255,255,0.35); z-index:15; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="ui">
  <div id="hint"></div>
  <div id="mute">[M] sound</div>
  <div id="battle">
    <div id="menu" class="px"></div>
    <div id="hud">
      <div class="left">
        <span id="soulheart" class="px" style="color:#ff2244;font-size:13px">♥</span>
        <span class="nm px">YOU</span>
        <span class="lv px">LV 1</span>
        <div id="hpwrap"><span class="px" style="font-size:9px;color:#ff0">HP</span><div id="hpbar"><div id="hpfill"></div></div><span id="hptxt" class="px">20 / 20</span></div>
      </div>
      <div id="btns">
        <div class="btn" data-b="FIGHT">FIGHT</div>
        <div class="btn" data-b="ACT">ACT</div>
        <div class="btn" data-b="ITEM">ITEM</div>
        <div class="btn" data-b="MERCY">MERCY</div>
      </div>
    </div>
  </div>
  <div id="dlg" class="px"></div>
  <div id="meter"><div class="target"></div><div class="cursor"></div></div>
  <div id="dmg"></div>
</div>
<div id="title">
  <h1>UNDERTALE 3D</h1>
  <h2>LAND OF THE DEAD</h2>
  <div class="sub">an unofficial fan demake &nbsp;·&nbsp; the complete tale &nbsp;·&nbsp; v0.6</div>
  <div class="go">PRESS [Z] TO BEGIN</div>
  <div class="ctl">WASD / ARROWS — move &nbsp;&nbsp; Z / ENTER — confirm &nbsp;&nbsp; X / SHIFT — back</div>
</div>
<div id="card"></div>
<div id="fade"></div>
<script type="module" src="game.js"></script>
</body>
</html>
